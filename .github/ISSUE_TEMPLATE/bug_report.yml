name: Bug report
description: Something is broken or behaving incorrectly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - ThemeProvider / theming
        - Button
        - Card
        - Input / Textarea
        - Toggle / Checkbox / RadioGroup
        - Slider
        - Select
        - Tabs / Accordion
        - Modal / Tooltip
        - Table / Pagination
        - Progress / Badge / Alert / Avatar
        - Spinner / Skeleton / Breadcrumb
        - Other / docs / packaging
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code sample or link to a repo/stackblitz.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: e.g. 0.1.0
  - type: input
    id: env
    attributes:
      label: Environment (browser, OS, React version)